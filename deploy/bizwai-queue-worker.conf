; Supervisor config for the Laravel queue worker.
;
; Required as of R1: QUEUE_CONNECTION is now "database", so dispatched jobs sit
; in the `jobs` table until a worker runs them. With no worker running, the
; QuickBooks sync never happens and the UI reports a sync that is still queued.
;
; Install:
;   sudo cp deploy/bizwai-queue-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start bizwai-queue-worker:*

[program:bizwai-queue-worker]
process_name=%(program_name)s_%(process_num)02d
; --queue puts quickbooks ahead of default so an interactive sync is not stuck
;   behind unrelated background work.
; --max-time recycles the process hourly so a long-lived worker cannot hold a
;   stale config or leak memory.
; --timeout must match SyncQuickBooksDataJob::$timeout and stay below the
;   connection's retry_after (900).
command=php /home/hardik.patel/mycollection/bizwai-latest/artisan queue:work database --queue=quickbooks,default --sleep=3 --tries=3 --timeout=600 --max-time=3600
directory=/home/hardik.patel/mycollection/bizwai-latest
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/home/hardik.patel/mycollection/bizwai-latest/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=630
