; Supervisor config for the Laravel queue worker.
;
; Required as of R1: QUEUE_CONNECTION is now "database", so dispatched jobs sit
; in the `jobs` table until a worker runs them. With no worker running, the
; QuickBooks sync never happens and the UI reports a sync that is still queued.
;
; ── ADJUST PER ENVIRONMENT ──────────────────────────────────────────────────
; command : must be a PHP >= 8.2 binary. Do NOT use a bare `php`; on this box
;           `php` is 7.4 and cannot parse laravel/prompts, so the worker exits
;           255 immediately and supervisor respawns it forever. Check with
;           `php8.3 -v` and `php8.3 artisan --version` before installing.
;           It also needs pdo_mysql: php8.2 and php8.4 here do not have it.
; user    : must own (or be able to write) storage/ and bootstrap/cache.
;           www-data cannot unless you chown/chmod those directories.
; ────────────────────────────────────────────────────────────────────────────
;
; Install:
;   sudo cp deploy/bizwai-queue-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start bizwai-queue-worker:*
;   sudo supervisorctl status bizwai-queue-worker:*
;
; If it will not start, the reason is in storage/logs/queue-worker.log.

[program:bizwai-queue-worker]
process_name=%(program_name)s_%(process_num)02d
; --queue puts quickbooks ahead of default so an interactive sync is not stuck
;   behind unrelated background work.
; --max-time recycles the process hourly so a long-lived worker cannot hold a
;   stale config or leak memory.
; --timeout must match SyncQuickBooksDataJob::$timeout and stay below the
;   connection's retry_after (900).
command=/usr/bin/php8.3 /home/hardik.patel/mycollection/bizwai-latest/artisan queue:work database --queue=quickbooks,default --sleep=3 --tries=3 --timeout=600 --max-time=3600
directory=/home/hardik.patel/mycollection/bizwai-latest
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=hardik.patel
numprocs=1
redirect_stderr=true
stdout_logfile=/home/hardik.patel/mycollection/bizwai-latest/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=630
